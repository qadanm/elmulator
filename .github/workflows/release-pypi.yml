name: Publish to PyPI

# Publishes the Python package when a GitHub release is published.
# Uses PyPI Trusted Publishing (OIDC), so no API token or secret is required.
# One-time setup on PyPI: add a trusted publisher for this repo with
#   owner: qadanm   repo: elmulator   workflow: release-pypi.yml   environment: pypi
#
# Manual workflow_dispatch is validation only. It runs the build job (sdist,
# wheel and metadata check) and never enters the pypi environment or requests
# an OIDC token.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
        working-directory: python
      - name: Verify version matches the release tag
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src'); import elmulator; print(elmulator.__version__)")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v$version" >&2
            exit 1
          fi
        working-directory: python
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: python/dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read        # no checkout, but keep the workflow default explicit
      id-token: write        # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
